[package]
name = "sloccrunch"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "CC0-1.0"
description = "Count source lines of code in a directory tree with per-language totals and optional COCOMO estimates"
readme = "README.md"
repository = "https://github.com/prophile/sloccrunch"
keywords = ["sloc", "cli", "loc", "cocomo", "linguist"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
file_type = { version = "0.8.11", features = ["linguist"] }
ignore = "0.4"
linguist = "0.1.9"
linguist-types = "0.1.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
